<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHERING LINK — Lagenda Alfa Video</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header class="top"><a class="brand" href="index.html"><span>▶</span> CHERING LINK</a><nav><a href="index.html">Beranda</a><a href="login.html">Admin</a></nav></header>
<main class="wrap"><section class="hero"><p class="eyebrow">VIDEO UNTUK DIBAGIKAN</p><h1>Tonton dan bagikan video.</h1><p class="muted">Kumpulan video milik Lagenda Alfa.</p></section>
<div class="section-head"><h2>Video terbaru</h2><span id="count" class="muted">0 video</span></div><div id="videoGrid" class="grid"></div><section id="empty" class="empty"><h3>Belum ada video</h3><p class="muted">Masuk ke dashboard admin untuk menambahkan video.</p><a class="button" href="login.html">Buka Admin</a></section></main><footer>© <span id="year"></span> CHERING LINK · Lagenda Alfa Video</footer>
<script src="assets/app.js"></script><script>
document.getElementById('year').textContent=new Date().getFullYear();
(async()=>{const grid=document.getElementById('videoGrid'),empty=document.getElementById('empty');try{const videos=await listVideos();document.getElementById('count').textContent=videos.length+' video';empty.hidden=videos.length>0;grid.innerHTML=videos.map(v=>`<article class="video-card"><a class="thumb" href="watch.html?id=${encodeURIComponent(v.id)}"><div class="drive-thumb">▶</div><span class="play">▶</span></a><div class="card-body"><h3><a href="watch.html?id=${encodeURIComponent(v.id)}">${htmlSafe(v.title)}</a></h3><p class="muted">${htmlSafe(v.description||'')}</p><div class="card-foot"><span>${dateLabel(v.createdAt)}</span><a href="watch.html?id=${encodeURIComponent(v.id)}">Tonton →</a></div></div></article>`).join('')}catch(e){empty.hidden=false;empty.innerHTML='<h3>Video belum dapat dimuat</h3><p class="muted">Pastikan Google Apps Script sudah di-deploy sebagai aplikasi web dengan akses Siapa saja, lalu muat ulang halaman.</p>';console.error(e)}})();
</script></body></html>
