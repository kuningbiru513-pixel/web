<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Video — CHERING LINK</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="top"><a class="brand" href="index.html"><span>▶</span> CHERING LINK</a><nav><a href="index.html">Lihat website</a><a href="#" id="logout">Keluar</a></nav></header><main class="wrap"><section class="hero"><p class="eyebrow">DASHBOARD ADMIN</p><h1>Kelola video</h1><p class="muted">Upload video kecil ke Google Drive dan bagikan tautan halaman tonton.</p></section>
<div class="admin-grid"><section class="panel"><h2>Upload video</h2><form id="uploadForm"><label>Judul video</label><input name="title" maxlength="200" required placeholder="Masukkan judul video"><label>Deskripsi</label><textarea name="description" rows="4" maxlength="5000" placeholder="Tentang video ini..."></textarea><label>File video (MP4, WebM, MOV)</label><input name="video" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" required><p class="muted small">Untuk versi ini gunakan video maksimal 4 MB (batas teknis Apps Script).</p><button id="uploadButton" class="button" type="submit">⬆ Simpan video</button></form><p id="status" class="muted small" role="status"></p></section><section class="panel"><h2>Ringkasan</h2><h1 id="total">0</h1><p class="muted">Video terdaftar di Google Drive</p></section></div>
<section class="panel"><h2>Daftar video</h2><div id="videoList"></div></section></main><script src="assets/app.js"></script><script>
if(sessionStorage.getItem('chering_local_admin')!=='yes')location.replace('login.html');
document.getElementById('logout').addEventListener('click',e=>{e.preventDefault();sessionStorage.removeItem('chering_local_admin');location.href='login.html'});
async function renderList(){const videos=await listVideos();document.getElementById('total').textContent=videos.length;document.getElementById('videoList').innerHTML=videos.length?videos.map(v=>`<div class="video-row"><div><strong>${htmlSafe(v.title)}</strong><div class="muted small">${dateLabel(v.createdAt)} · ${htmlSafe(v.fileName||'Video')}</div><a href="watch.html?id=${encodeURIComponent(v.id)}">Buka halaman tonton</a></div><div class="actions"><button class="button secondary" type="button" onclick="copyValue(watchUrl('${v.id}'))">Salin link</button><a class="button secondary" href="${htmlSafe(v.driveUrl)}" target="_blank" rel="noopener">Buka Drive</a></div></div>`).join(''):'<p class="muted">Belum ada video.</p>'}
document.getElementById('uploadForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,file=form.video.files[0];if(!file)return;if(file.size>4*1024*1024){alert('Ukuran video maksimal 4 MB untuk versi ini.');return}const button=document.getElementById('uploadButton'),status=document.getElementById('status');button.disabled=true;status.textContent='Mengirim video ke Google Drive… jangan tutup halaman.';try{await uploadVideo(file,form.title.value,form.description.value);status.textContent='Permintaan upload sudah dikirim. Tunggu 5–10 detik, lalu muat ulang daftar. Jika video tidak muncul, periksa izin dan log Apps Script.';form.reset();await new Promise(r=>setTimeout(r,6000));await renderList()}catch(err){status.textContent='Upload gagal: '+err.message;alert('Upload gagal: '+err.message)}finally{button.disabled=false}});
renderList().catch(e=>{document.getElementById('videoList').textContent='Gagal memuat daftar. Periksa deployment Apps Script.';console.error(e)});
</script></body></html>
