<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonton Video — CHERING LINK</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="top"><a class="brand" href="index.html"><span>▶</span> CHERING LINK</a><nav><a href="index.html">Semua video</a></nav></header><main class="wrap" id="main"><section class="panel"><h1>Memuat video…</h1></section></main><script src="assets/app.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id'),main=document.getElementById('main');try{const videos=await listVideos(),video=videos.find(v=>v.id===id);if(!video){main.innerHTML='<section class="panel"><h1>Video tidak ditemukan</h1><p class="muted">Video belum tersimpan atau link tidak benar. Kembali ke beranda dan coba lagi.</p><a class="button" href="index.html">Kembali</a></section>';return}document.title=video.title+' — CHERING LINK';main.innerHTML=`<p><a class="muted" href="index.html">← Semua video</a></p><div class="player"><iframe src="https://drive.google.com/file/d/${encodeURIComponent(video.fileId)}/preview" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:60vw;max-height:640px;border:0"></iframe></div><section><h1>${htmlSafe(video.title)}</h1><p class="muted">Diunggah ${dateLabel(video.createdAt)}</p><p>${htmlSafe(video.description||'')}</p><div class="share-row"><input id="shareLink" readonly><button class="button" id="copyLink">Salin link</button></div><p><a target="_blank" rel="noopener" href="${htmlSafe(video.driveUrl)}">Buka video di Google Drive</a></p></section>`;document.getElementById('shareLink').value=watchUrl(video.id);document.getElementById('copyLink').onclick=()=>copyValue(watchUrl(video.id));}catch(e){main.innerHTML='<section class="panel"><h1>Gagal membuka video</h1><p class="muted">Pastikan Apps Script sudah di-deploy dan koneksi internet aktif.</p></section>';console.error(e)}})();
</script></body></html>
